<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Aither Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">AITHER</div>
        <h1>Calculator</h1>
      </div>
      <button id="settingsBtn" class="icon-btn" aria-label="Open settings">⚙</button>
    </header>

    <section class="calculator" aria-label="Calculator">
      <div class="display-wrap">
        <div id="expression" class="expression" aria-live="polite"></div>
        <div id="display" class="display" aria-live="polite">0</div>
      </div>

      <div id="scientific" class="scientific hidden">
        <button data-action="function" data-value="sin">sin</button>
        <button data-action="function" data-value="cos">cos</button>
        <button data-action="function" data-value="tan">tan</button>
        <button data-action="function" data-value="sqrt">√</button>
        <button data-action="function" data-value="square">x²</button>
        <button data-action="function" data-value="log">log</button>
        <button data-action="function" data-value="ln">ln</button>
        <button data-action="constant" data-value="pi">π</button>
      </div>

      <div class="keypad">
        <button class="utility" data-action="clear">AC</button>
        <button class="utility" data-action="backspace">⌫</button>
        <button class="utility" data-action="percent">%</button>
        <button class="operator" data-action="operator" data-value="÷">÷</button>

        <button data-action="number" data-value="7">7</button>
        <button data-action="number" data-value="8">8</button>
        <button data-action="number" data-value="9">9</button>
        <button class="operator" data-action="operator" data-value="×">×</button>

        <button data-action="number" data-value="4">4</button>
        <button data-action="number" data-value="5">5</button>
        <button data-action="number" data-value="6">6</button>
        <button class="operator" data-action="operator" data-value="−">−</button>

        <button data-action="number" data-value="1">1</button>
        <button data-action="number" data-value="2">2</button>
        <button data-action="number" data-value="3">3</button>
        <button class="operator" data-action="operator" data-value="+">+</button>

        <button class="utility" data-action="sign">±</button>
        <button data-action="number" data-value="0">0</button>
        <button data-action="decimal">.</button>
        <button class="equals" data-action="equals">=</button>
      </div>
    </section>

    <section class="history-card">
      <div class="section-title"><h2>History</h2><button id="clearHistory" class="text-btn">Clear</button></div>
      <div id="history" class="history-empty">Your calculations will appear here.</div>
    </section>
  </main>

  <div id="settingsModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal-card">
      <div class="modal-head"><h2 id="settingsTitle">Settings</h2><button id="closeSettings" class="icon-btn">×</button></div>
      <label class="setting"><span>Scientific mode</span><input id="scientificToggle" type="checkbox"></label>
      <label class="setting"><span>Dark mode</span><input id="darkToggle" type="checkbox" checked></label>
      <label class="setting"><span>Haptic feedback</span><input id="hapticToggle" type="checkbox" checked></label>
      <button id="forceUpdate" class="setting-button">Force update</button>
      <div class="version">Aither Calculator v1.0.0</div>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
