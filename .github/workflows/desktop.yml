name: Build Aither Calculator Desktop

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'true'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            command: build:win
          - os: macos-latest
            artifact: macos
            command: build:mac
          - os: ubuntu-latest
            artifact: linux
            command: build:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build desktop app
        run: npm run ${{ matrix.command }}

      - name: List build output
        shell: bash
        run: ls -lah dist

      - name: Upload desktop build
        uses: actions/upload-artifact@v4
        with:
          name: aither-calculator-${{ matrix.artifact }}
          path: desktop/dist/*
          if-no-files-found: error
