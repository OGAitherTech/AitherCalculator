name: Build Aither Calculator Desktop
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'index.html'
      - 'app.js'
      - 'style.css'
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: aither-calculator-${{ matrix.os }}
          path: desktop/dist/*
