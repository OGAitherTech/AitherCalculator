name: Build Aither Calculator Desktop
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'index.html'
      - 'app.js'
      - 'style.css'
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build desktop app
        run: npm run build
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: aither-calculator-${{ matrix.artifact }}
          path: desktop/dist/*
